name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/poker_tracker_test
      E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/poker_tracker_e2e

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          npm install
          npm install --prefix server
          npm install --prefix client

      - name: Generate Prisma client
        run: npm run db:generate --prefix server

      - name: Create test databases
        run: |
          psql "postgresql://postgres:postgres@localhost:5432/postgres" -c "CREATE DATABASE poker_tracker_test;"
          psql "postgresql://postgres:postgres@localhost:5432/postgres" -c "CREATE DATABASE poker_tracker_e2e;"
        env:
          PGPASSWORD: postgres

      - name: Apply migrations
        working-directory: server
        run: |
          DATABASE_URL="$TEST_DATABASE_URL" npx prisma migrate deploy
          DATABASE_URL="$E2E_DATABASE_URL" npx prisma migrate deploy

      - name: Typecheck (server)
        working-directory: server
        run: npx tsc --noEmit

      - name: Build client (typecheck + bundle)
        run: npm run build:client

      - name: Unit tests (server)
        run: npm test --prefix server

      - name: Unit tests (client)
        run: npm test --prefix client

      - name: Integration tests
        run: npm run test:integration --prefix server

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
